<dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-title">
  <button class="dialog-close" data-close aria-label="Close contact">×</button>
  <p class="eyebrow">Start a conversation</p>
  <h2 id="contact-title">What are you<br /><em>working on?</em></h2>
  <p>A difficult inspection point. A new control problem. A useful partnership.</p>
  <label for="contact-topic">I'm interested in</label>
  <select id="contact-topic">
    <option value="Inspection use case">Inspection &amp; field validation</option>
    <option value="Robotics R&D collaboration">Robotics R&amp;D</option>
    <option value="Research partnership">Research &amp; partnership</option>
    <option value="Hello Volar">Something else</option>
  </select>
  <a
    class="button button-dark contact-email"
    href="mailto:hello@volar-robotics.com?subject=Inspection%20use%20case"
    >Write to Volar <span aria-hidden="true">↗</span></a
  >
  <p class="contact-address">hello@volar-robotics.com<br />Rome, Italy</p>
</dialog>
