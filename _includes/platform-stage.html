<div class="platform-scene" data-product-stage>
  <div class="stage-capsule" aria-hidden="true"></div>
  <div class="platform-window">
    <div class="platform-drift">
      <img
        class="stage-product"
        src="{{ '/assets/img/platform-minithex.png' | relative_url }}"
        srcset="{{ '/assets/img/platform-minithex-small.png' | relative_url }} 1338w, {{ '/assets/img/platform-minithex.png' | relative_url }} 2409w"
        sizes="(max-width: 820px) 96vw, 760px"
        width="2409"
        height="1440"
        alt="miniThex research platform emerging from a capsule-shaped opening"
        {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
      />
    </div>
  </div>
  <div class="platform-foreground" aria-hidden="true">
    <div class="platform-drift">
      <img
        class="stage-product"
        src="{{ '/assets/img/platform-minithex.png' | relative_url }}"
        srcset="{{ '/assets/img/platform-minithex-small.png' | relative_url }} 1338w, {{ '/assets/img/platform-minithex.png' | relative_url }} 2409w"
        sizes="(max-width: 820px) 96vw, 760px"
        width="2409"
        height="1440"
        alt=""
        {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
      />
    </div>
  </div>
  <span class="accent-dot stage-orbit orbit-one" aria-hidden="true"></span>
  <span class="accent-dot accent-dot-sand stage-orbit orbit-two" aria-hidden="true"></span>
</div>
<span class="stage-caption">miniThex · Research platform · CAD</span>
