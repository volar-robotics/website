title: Volar Robotics
tagline: Enabling physical interaction in the sky
description: >-
  Volar Robotics develops aerial robots capable of physically 
  interacting with their environment, not just observing it: 
  drones that establish stable contact for industrial inspection, 
  the first step toward the “drone-as-a-worker” paradigm.
url: "https://volar-robotics.com"
baseurl: ""
lang: en

author:
  name: Volar Robotics

# Use Jekyll's safe defaults; no remote theme.
theme: null
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - test

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-image.svg
  - scope:
      path: ""
      type: projects
    values:
      layout: default
