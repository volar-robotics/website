title: Volar Robotics
tagline: Enabling tactile interaction in the sky
description: >-
  Volar Robotics develops friction-anchor interaction and soft-optical tactile sensing for aerial
  robots that make controlled contact with infrastructure. Contact flight
  demonstrated in the laboratory; industrial thickness inspection in development.
url: "https://volar-robotics.com"
baseurl: ""
lang: en

author:
  name: Volar Robotics

# Use Jekyll's safe defaults; no remote theme.
theme: null
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

redirect_from:
  json: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - AGENTS.md
  - assets/brand/README.md
  - vendor
  - .bundle
  - test

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-image.svg
