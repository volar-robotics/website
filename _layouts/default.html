<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FEE9D9">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preload" href="{{ '/assets/fonts/montserrat-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {%- seo -%}
</head>
<body id="page-top" class="{{ page.body_class | default: 'content-route' }}" data-baseurl="{{ site.baseurl }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include contact-dialog.html %}
  <script src="{{ '/assets/js/experience.js' | relative_url }}?v={{ site.time | date: '%s' }}" type="module"></script>
</body>
</html>
